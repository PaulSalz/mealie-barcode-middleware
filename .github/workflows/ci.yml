name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  syntax-smoke:
    runs-on: ubuntu-latest
    env:
      MEALIE_URL: http://127.0.0.1:9000
      MEALIE_API_KEY: ci-test-key
      MEALIE_SHOPPING_LIST_ID: 00000000-0000-4000-8000-000000000001
      MIDDLEWARE_BASE_URL: http://b2m.local:9930
      DB_PATH: /tmp/b2m-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q app tests tools/barcode2mealie-usb/scanner.py tools/ci_stability_smoke.py tools/ci_browser_smoke.py tools/ci_theme_v33_smoke.py
      - name: Import application modules
        run: |
          python - <<'PY'
          import app.models
          import app.models_scan_delivery
          import app.services.actions
          import app.services.barcode_lookup
          import app.services.barcode_state
          import app.services.bounded_executor
          import app.services.database_backup
          import app.services.mealie_extras
          import app.services.multitarget
          import app.services.niimblue
          import app.services.recipes
          import app.services.shopping
          import app.services.targets
          import app.routers.actions
          import app.routers.barcodes
          import app.routers.dashboard
          import app.routers.database_backup
          import app.routers.integrations
          import app.routers.items
          import app.routers.label_printer
          import app.routers.labels
          import app.routers.recipes
          import app.routers.runtime_features
          import app.routers.scan
          import app.routers.scan_gateway
          import app.routers.scanner
          import app.routers.shopping_print
          print('imports ok')
          PY
      - name: Smoke-test SQLite migration and legacy target backfill
        run: |
          rm -f /tmp/b2m-ci.db
          python - <<'PY'
          from app import models  # noqa: F401 - registers metadata
          from app.database import SessionLocal, init_db
          from app.models import BarcodeMapping, BarcodeTarget, Item

          init_db()
          db = SessionLocal()
          db.add(Item(id='food-ci', name='CI Food', source='mealie'))
          db.add(BarcodeMapping(
              barcode='legacy-ci', target_type='food', target_id='food-ci',
              target_name='CI Food', quantity=1.0, mapped_by='manual',
          ))
          db.commit()
          db.close()

          init_db()
          db = SessionLocal()
          rows = db.query(BarcodeTarget).filter(BarcodeTarget.barcode == 'legacy-ci').all()
          assert len(rows) == 1, rows
          assert rows[0].target_id == 'food-ci'
          assert rows[0].shopping_list_ids_json == '[]'
          db.close()
          print('migration/backfill ok')
          PY
      - name: Pytest reliability suite
        run: python -m pytest -q
      - name: Parse Jinja templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.templating import templates
          root = Path('app/templates')
          for path in sorted(root.glob('*.html')):
              templates.env.get_template(path.name)
              print('parsed', path.name)
          PY
      - name: Check JavaScript syntax
        run: |
          for file in app/static/js/*.js; do
            echo "checking $file"
            node --check "$file"
          done

  browser-smoke:
    needs: syntax-smoke
    runs-on: ubuntu-latest
    env:
      MEALIE_URL: http://127.0.0.1:9000
      MEALIE_API_KEY: ci-test-key
      MEALIE_SHOPPING_LIST_ID: 00000000-0000-4000-8000-000000000001
      MIDDLEWARE_BASE_URL: http://127.0.0.1:8001
      DB_PATH: /tmp/b2m-browser.db
      B2M_BROWSER_URL: http://127.0.0.1:8001
      # Point the optional printer adapter back at the local B2M server. This
      # marks B21 as configured for UI coverage while /connected fails fast
      # with 404 instead of requiring a physical printer in CI.
      NIIMBLUE_URL: http://127.0.0.1:8001
      NIIMBLUE_ADDRESS: ci-b21
      NIIMBLUE_TRANSPORT: ble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Prepare local database
        run: |
          rm -f /tmp/b2m-browser.db
          python - <<'PY'
          from app.database import SessionLocal, init_db
          from app.models import Item
          init_db()
          db = SessionLocal()
          db.add(Item(id='browser-food', name='Browser Food', source='mealie'))
          db.commit()
          db.close()
          PY
      - name: Start B2M
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8001 >/tmp/b2m-browser.log 2>&1 &
          echo $! >/tmp/b2m-browser.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/setup >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/b2m-browser.log
          exit 1
      - name: Browser setup smoke
        run: |
          python tools/ci_browser_smoke.py
          python tools/ci_theme_v33_smoke.py
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/b2m-browser.log || true
      - name: Stop B2M
        if: always()
        run: kill $(cat /tmp/b2m-browser.pid) 2>/dev/null || true
