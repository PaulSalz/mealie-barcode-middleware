name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  syntax-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app tools/barcode2mealie-usb/scanner.py
      - name: Import application modules
        run: |
          python - <<'PY'
          import app.models
          import app.services.actions
          import app.services.mealie_extras
          import app.routers.actions
          import app.routers.barcodes
          import app.routers.dashboard
          import app.routers.integrations
          import app.routers.items
          import app.routers.labels
          import app.routers.scan
          print('imports ok')
          PY
      - name: Check JavaScript syntax
        run: |
          node --check app/static/js/action-page.js
          node --check app/static/js/decimal-number.js
          node --check app/static/js/enhancements.js
          node --check app/static/js/labels-page.js
