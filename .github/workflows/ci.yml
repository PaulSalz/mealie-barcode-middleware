name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  syntax-smoke:
    runs-on: ubuntu-latest
    env:
      MEALIE_URL: http://127.0.0.1:9000
      MEALIE_API_KEY: ci-test-key
      MEALIE_SHOPPING_LIST_ID: 00000000-0000-4000-8000-000000000001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app tools/barcode2mealie-usb/scanner.py
      - name: Import application modules
        run: |
          python - <<'PY'
          import app.models
          import app.services.actions
          import app.services.mealie_extras
          import app.routers.actions
          import app.routers.barcodes
          import app.routers.dashboard
          import app.routers.integrations
          import app.routers.items
          import app.routers.labels
          import app.routers.scan
          print('imports ok')
          PY
      - name: Parse Jinja templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader
          root = Path('app/templates')
          env = Environment(loader=FileSystemLoader(str(root)))
          for path in sorted(root.glob('*.html')):
              env.get_template(path.name)
              print('parsed', path.name)
          PY
      - name: Check JavaScript syntax
        run: |
          node --check app/static/js/action-page.js
          node --check app/static/js/decimal-number.js
          node --check app/static/js/enhancements.js
          node --check app/static/js/labels-page.js
