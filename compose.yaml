services:
  barcode-middleware:
    build:
      context: .
      network: host
    container_name: mealie-barcode-middleware
    restart: unless-stopped

    ports:
      - "9930:8000"

    volumes:
      - mealie_barcode_data:/data

    environment:
      MEALIE_URL: "${MEALIE_URL}"
      MEALIE_API_KEY: "${MEALIE_API_KEY}"
      MEALIE_SHOPPING_LIST_ID: "${MEALIE_SHOPPING_LIST_ID}"
      MIDDLEWARE_BASE_URL: "${MIDDLEWARE_BASE_URL}"
      HA_WEBHOOK_URL: "${HA_WEBHOOK_URL:-}"

      # Optional local niimblue-node REST service for direct NIIMBOT printing.
      NIIMBLUE_URL: "${NIIMBLUE_URL:-}"
      NIIMBLUE_TRANSPORT: "${NIIMBLUE_TRANSPORT:-ble}"
      NIIMBLUE_ADDRESS: "${NIIMBLUE_ADDRESS:-}"
      NIIMBLUE_PRINT_TASK: "${NIIMBLUE_PRINT_TASK:-D110M_V4}"
      NIIMBLUE_PRINT_DIRECTION: "${NIIMBLUE_PRINT_DIRECTION:-top}"
      NIIMBLUE_DENSITY: "${NIIMBLUE_DENSITY:-3}"
      NIIMBLUE_LABEL_TYPE: "${NIIMBLUE_LABEL_TYPE:-1}"
      NIIMBLUE_DPI: "${NIIMBLUE_DPI:-300}"
      NIIMBLUE_MAX_LABEL_WIDTH_MM: "${NIIMBLUE_MAX_LABEL_WIDTH_MM:-50}"
      NIIMBLUE_TIMEOUT: "${NIIMBLUE_TIMEOUT:-30}"

      TIMEZONE: "Europe/Berlin"
      OFF_ENABLED: "true"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  mealie_barcode_data:
