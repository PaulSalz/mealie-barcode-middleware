services:
  barcode-middleware:
    build:
      context: .
      network: host
    container_name: mealie-barcode-middleware
    restart: unless-stopped

    ports:
      - "9930:8000"

    volumes:
      - mealie_barcode_data:/data

    environment:
      MEALIE_URL: "${MEALIE_URL}"
      MEALIE_API_KEY: "${MEALIE_API_KEY}"
      MEALIE_SHOPPING_LIST_ID: "${MEALIE_SHOPPING_LIST_ID}"
      MIDDLEWARE_BASE_URL: "${MIDDLEWARE_BASE_URL}"
      HA_WEBHOOK_URL: "${HA_WEBHOOK_URL:-}"

      TIMEZONE: "Europe/Berlin"
      OFF_ENABLED: "true"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  mealie_barcode_data:
